<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Project Monitor</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap">
<style>
  :root {
    --bg: #fbf6ee; --text: #3b3a46; --muted: #8a8798;
    --panel: #ffffff; --border: rgba(60, 50, 40, .1);
    --amber: #d9962a; --blue: #4f86d8;
  }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; }
  .hud { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 16px 16px 4px; }
  .hud h1 { margin: 0 8px 0 0; font-size: 22px; }
  .hud .spacer { flex: 1; }
  .chip { padding: 4px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--border); font-size: 14px; }
  .chip .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .chip.warn { border-color: var(--amber); color: var(--amber); }
  .hud a { color: var(--muted); font-size: 14px; }
  #main { padding: 8px 16px 32px; }
  #main h2 { font-size: 16px; color: var(--muted); font-weight: 600; margin: 20px 4px 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 14px; }
  .pet { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 20px; background: var(--panel);
    border: 2px solid color-mix(in srgb, var(--c) 35%, transparent); box-shadow: 0 4px 14px rgba(90, 70, 40, .06); }
  .pet.faint { opacity: .55; }
  .face { position: relative; font-size: 52px; line-height: 1; flex: none; width: 64px; text-align: center;
    animation: breathe 4s ease-in-out infinite; }
  .pet.red .face { filter: grayscale(.4); animation: none; transform: rotate(-8deg); }
  .pet.gray .face { filter: grayscale(1); animation: none; }
  .pet.amber .face { animation-duration: 7s; }
  .badge { position: absolute; right: -6px; top: -8px; font-size: 22px; }
  .body { min-width: 0; flex: 1; }
  .pet h3 { margin: 0 0 2px; font-size: 17px; overflow-wrap: anywhere; }
  .mood { font-size: 14px; color: var(--c); font-weight: 600; filter: brightness(.85); }
  .bar { height: 8px; border-radius: 999px; background: rgba(60, 50, 40, .08); margin: 10px 0 6px; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; background: var(--c); transition: width 1s; }
  .meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .commit { font-style: italic; }
  @keyframes breathe { 50% { transform: translateY(-2px) scale(1.04); } }
  @media (prefers-reduced-motion: reduce) { .face { animation: none !important; } }
  #msg { padding: 48px 16px; text-align: center; font-size: 16px; }
  #msg:empty { display: none; }
  #msg a { color: var(--blue); }
  #dim { position: fixed; inset: 0; background: #2a2416; opacity: 0; pointer-events: none; transition: opacity 3s; }
  body.night #dim { opacity: .35; }
</style>
<script src="config.js"></script>
</head>
<body>
<div class="hud">
  <h1>Projects</h1>
  <span id="chips" style="display:contents"></span>
  <span class="spacer"></span>
  <span id="clock" class="chip"></span>
  <a href="./">กลับหน้าหลัก</a>
</div>
<div id="msg"></div>
<main id="main"></main>
<div id="dim"></div>

<script type="module">
const API = typeof API_URL === 'string' ? API_URL.trim() : '';
const REFRESH_MS = 5 * 60 * 1000;
const DAY_MS = 86400000;
const STATES = {
  green: { color: '#5cc69a', text: 'อัปเดตไม่เกิน 3 วัน', mood: 'สบายดี', badge: '✨' },
  amber: { color: '#f0b452', text: 'อัปเดต 4–7 วัน', mood: 'เริ่มง่วง', badge: '💤' },
  red:   { color: '#ef7b73', text: 'ไม่ขยับเกิน 7 วัน', mood: 'เหงาแล้วนะ', badge: '🥺' },
  done:  { color: '#6ea8ff', text: 'เสร็จแล้ว', mood: 'ฉลอง!', badge: '🎉' },
  gray:  { color: '#a3a5b3', text: 'ไม่มีข้อมูล / เก่า', mood: 'หลับยาว', badge: '👻' },
};
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const truncate = (s, n) => { const a = Array.from(s || ''); return a.length > n ? a.slice(0, n).join('') + '…' : a.join(''); };
const rtf = new Intl.RelativeTimeFormat('th', { numeric: 'auto' });
function relTime(t) {
  if (!t) return '';
  const days = Math.round((t - Date.now()) / DAY_MS);
  if (days === 0) return 'วันนี้';
  return Math.abs(days) < 60 ? rtf.format(days, 'day') : rtf.format(Math.round(days / 30), 'month');
}
const repoName = (r) => String(r || '').trim().split(/\s/)[0].split('/').pop().toLowerCase();

let session = null;
try { session = JSON.parse(localStorage.getItem('pt_session')); } catch { /* ignore */ }

async function get(action) {
  const u = new URL(API);
  u.searchParams.set('action', action);
  u.searchParams.set('sessionToken', session.token);
  const res = await fetch(u, { cache: 'no-store' });
  const json = await res.json();
  if (!json || json.ok !== true) throw new Error((json && json.error) || 'unknown');
  return json;
}

// ---------------------------------------------------------------------------
// ข้อมูล: Tracker (checklist) + commit + vault (frontmatter)
// ---------------------------------------------------------------------------
function build(list, commits, vault) {
  const today = new Date().toLocaleDateString('sv'); // YYYY-MM-DD ตามเวลาเครื่อง
  const ideasBy = new Map();
  for (const i of list.ideas || []) {
    const k = (i.project || '').toLowerCase();
    if (!ideasBy.has(k)) ideasBy.set(k, []);
    ideasBy.get(k).push(i.text);
  }
  const used = new Set();
  const out = list.projects.map((p) => {
    const its = list.items.filter((i) => i.projectId === p.id);
    const done = its.filter((i) => i.done).length;
    const complete = its.length > 0 && done === its.length;
    const rn = repoName(p.repo);
    const v = vault.find((n) => rn && repoName(n.repo) === rn) || vault.find((n) => n.name.toLowerCase() === p.name.trim().toLowerCase());
    if (v) used.add(v);
    return entry({
      name: p.name, group: (p.group || '').trim(), total: its.length, done, complete,
      pct: complete ? 100 : its.length ? Math.floor((done / its.length) * 100) : 0,
      commit: commits[p.id] || null, note: v || null, due: p.dueDate || '',
      overdue: !!p.dueDate && !complete && p.dueDate < today,
      ideas: ideasBy.get(p.name.toLowerCase()) || [],
    });
  });
  // โปรเจกต์ที่มีแค่ใน vault → แสดงจาง ๆ
  for (const v of vault) {
    if (used.has(v)) continue;
    out.push(entry({ name: v.name, group: 'มีแค่ใน vault', total: 0, done: 0, complete: false, pct: 0,
      commit: null, note: v, due: '', overdue: false, ideas: ideasBy.get(v.name.toLowerCase()) || [], faint: true }));
  }
  return out;
}

function entry(d) {
  d.last = Math.max(Date.parse(d.commit && d.commit.date) || 0, Date.parse(d.note && d.note.updated) || 0);
  const m = /(\d+)\s*\/\s*(\d+)/.exec((d.note && d.note.phase) || '');
  d.phase = m && +m[2] > 0 ? { at: Math.min(+m[1], +m[2]), total: Math.min(+m[2], 12) } : null;
  const age = (Date.now() - d.last) / DAY_MS;
  d.state = d.complete ? 'done'
    : (d.note && d.note.status === 'historical') || !d.last ? 'gray'
    : age <= 3 ? 'green' : age <= 7 ? 'amber' : 'red';
  return d;
}

// ---------------------------------------------------------------------------
// การ์ดสัตว์เลี้ยง: โปรเจกต์ละตัว อารมณ์ตามสถานะ
// ---------------------------------------------------------------------------
const PETS = ['🐱', '🐶', '🐰', '🐹', '🐻', '🐼', '🐨', '🦊'];
const petOf = (name) => PETS[Array.from(name).reduce((h, ch) => (h * 31 + ch.codePointAt(0)) >>> 0, 0) % PETS.length];

function card(d) {
  const st = STATES[d.state];
  const c = el('article', 'pet ' + d.state + (d.faint ? ' faint' : ''));
  c.style.setProperty('--c', st.color);
  const face = el('div', 'face', petOf(d.name));
  face.append(el('span', 'badge', d.overdue ? '⏰' : st.badge));
  const body = el('div', 'body');
  body.append(el('h3', null, d.name), el('div', 'mood', st.mood + ' · ' + st.text));
  if (d.total) {
    const bar = el('div', 'bar');
    const fill = el('div', 'fill');
    fill.style.width = d.pct + '%';
    bar.append(fill);
    body.append(bar, el('div', 'meta', `${d.pct}% · checklist ${d.done}/${d.total}` + (d.phase ? ` · phase ${d.phase.at}/${d.phase.total}` : '')));
  } else {
    body.append(el('div', 'meta', d.faint ? 'มีแค่ใน vault' : 'ยังไม่มี checklist'));
  }
  const bits = [];
  if (d.last) bits.push('ล่าสุด ' + relTime(d.last));
  if (d.due) bits.push((d.overdue ? 'เลยกำหนด ' : 'กำหนด ') + d.due);
  if (d.ideas.length) bits.push(`💡 ${d.ideas.length}`);
  if (bits.length) body.append(el('div', 'meta', bits.join(' · ')));
  if (d.commit) body.append(el('div', 'meta commit', truncate(d.commit.message, 70)));
  c.append(face, body);
  return c;
}

function render(data) {
  const groups = new Map();
  for (const d of data) {
    const k = d.group || 'ไม่มีกลุ่ม';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(d);
  }
  const keys = [...groups.keys()].sort((a, b) => (a === 'มีแค่ใน vault') - (b === 'มีแค่ใน vault') || a.localeCompare(b, 'th'));
  const out = [];
  for (const k of keys) {
    const sec = el('section');
    if (keys.length > 1) sec.append(el('h2', null, k));
    const grid = el('div', 'grid');
    grid.append(...groups.get(k).map(card));
    sec.append(grid);
    out.push(sec);
  }
  $('#main').replaceChildren(...out);
}

// ---------------------------------------------------------------------------
// HUD + โหลดข้อมูล
// ---------------------------------------------------------------------------
function renderChips(data, warns) {
  const chips = [];
  for (const k of ['green', 'amber', 'red', 'done']) {
    const n = data.filter((d) => d.state === k && !d.faint).length;
    if (!n) continue;
    const c = el('span', 'chip');
    const sw = el('span', 'sw');
    sw.style.background = STATES[k].color;
    c.append(sw, `${STATES[k].text} ${n}`);
    chips.push(c);
  }
  const ideas = data.reduce((n, d) => n + d.ideas.length, 0);
  if (ideas) chips.push(el('span', 'chip', `💡 ${ideas}`));
  for (const w of warns) chips.push(el('span', 'chip warn', '⚠ ' + w));
  chips.push(el('span', 'chip', 'ข้อมูล ' + new Date().toLocaleTimeString('th', { hour: '2-digit', minute: '2-digit' })));
  $('#chips').replaceChildren(...chips);
}

async function load() {
  try {
    const list = await get('list');
    const warns = [];
    const [c, v] = await Promise.allSettled([get('commits'), get('vault')]);
    const commits = c.status === 'fulfilled' ? c.value.commits || {} : {};
    const vault = v.status === 'fulfilled' && Array.isArray(v.value.vault) ? v.value.vault : [];
    if (v.status === 'rejected') warns.push('อ่าน vault ไม่ได้: ' + truncate(v.reason.message, 90));
    if (c.status === 'rejected') warns.push('ดึง commit ไม่ได้: ' + truncate(c.reason.message, 90));
    const withRepo = list.projects.filter((p) => p.repo);
    if (c.status === 'fulfilled' && withRepo.length && !withRepo.some((p) => commits[p.id])) warns.push('ไม่มี commit เลย — GITHUB_TOKEN หมดอายุ?');
    const exp = v.status === 'fulfilled' && Date.parse(String(v.value.tokenExpires || '').slice(0, 10)); // "2026-11-01 00:00:00 UTC" → แค่วันที่
    if (exp) {
      const days = Math.floor((exp - Date.now()) / DAY_MS);
      if (days <= 14) warns.push(days < 0 ? 'GITHUB_TOKEN หมดอายุแล้ว' : `GITHUB_TOKEN หมดอายุใน ${days} วัน`);
    }
    const newest = Math.max(0, ...vault.map((n) => Date.parse(n.updated) || 0));
    if (newest && Date.now() - newest > 3 * DAY_MS) warns.push(`vault ไม่ได้ sync ${Math.floor((Date.now() - newest) / DAY_MS)} วัน`);

    const data = build(list, commits, vault);
    renderChips(data, warns);
    render(data);
    $('#msg').textContent = data.length ? '' : 'ไม่มีข้อมูลให้แสดง — ดูข้อความ ⚠ ด้านบน';
  } catch (e) {
    if (e.message === 'unauthorized') return needLogin();
    renderChips([], ['โหลดข้อมูลไม่สำเร็จ: ' + truncate(e.message, 60)]);
  }
}

function needLogin() {
  const m = $('#msg');
  const a = el('a', null, 'เข้าสู่ระบบที่หน้าหลัก');
  a.href = './';
  const box = el('div', null, 'ยังไม่ได้เข้าสู่ระบบ — ');
  box.append(a);
  m.replaceChildren(box);
}

function tickClock() {
  const now = new Date();
  $('#clock').textContent = now.toLocaleString('th', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const hr = now.getHours();
  document.body.classList.toggle('night', hr >= 20 || hr < 7);
}

(function init() {
  tickClock();
  setInterval(tickClock, 30 * 1000);
  if (!API) { $('#msg').textContent = 'ยังไม่ได้ตั้ง API_URL ใน config.js'; return; }
  if (!session || !session.token) return needLogin();
  load();
  setInterval(load, REFRESH_MS); // poll ต่ออายุ session ไปด้วย เปิดทิ้งไว้ได้
})();
</script>
</body>
</html>
